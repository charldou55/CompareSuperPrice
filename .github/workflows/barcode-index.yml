name: Rebuild barcode search index
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/rebuild_barcode_index.py
      - .github/workflows/barcode-index.yml
permissions:
  contents: write
concurrency:
  group: pricecompare-barcode-index
  cancel-in-progress: false
jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - name: Build the exact barcode lookup from downloaded official prices
        run: python scripts/rebuild_barcode_index.py
      - name: Commit generated barcode lookup
        run: |
          git config user.name "pricecompare-data-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/cities/jerusalem/barcodes/
          if ! git diff --cached --quiet; then
            git commit -m "data: add exact barcode lookup for official prices"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: barcode-index-diagnostics
          path: data/status.json
          retention-days: 3
