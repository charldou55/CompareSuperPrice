name: Rebuild verified store coverage
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/rebuild_coverage.py
      - .github/workflows/coverage.yml
permissions:
  contents: write
concurrency:
  group: pricecompare-data-publisher
  cancel-in-progress: false
jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - run: python scripts/rebuild_coverage.py
      - name: Publish cumulative coverage
        run: |
          git config user.name "pricecompare-data-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/coverage.json
          if ! git diff --cached --quiet; then
            git commit -m "data: publish verified cumulative store coverage"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
