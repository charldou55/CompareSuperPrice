name: Export official store directories
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/export_store_directory.py
      - .github/workflows/store-directory.yml
  schedule:
    - cron: "37 4 * * *"
permissions:
  contents: write
concurrency:
  group: pricecompare-store-directory
  cancel-in-progress: false
jobs:
  catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - name: Fetch publicly published branch directories
        run: python scripts/export_store_directory.py --limit 31
      - name: Publish directory
        run: |
          git config user.name "pricecompare-data-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/stores.json
          if ! git diff --cached --quiet; then
            git commit -m "data: refresh official store directory"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: stores-directory-report
          path: data/stores.json
          if-no-files-found: warn
          retention-days: 5
