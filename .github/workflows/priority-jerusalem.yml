name: Bootstrap Jerusalem priority chains
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/priority-jerusalem.yml
      - scripts/collect.py
concurrency:
  group: pricecompare-hourly
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  priority:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: true
          ref: main
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - name: Collect priority Jerusalem stores
        id: collect
        continue-on-error: true
        run: |
          python scripts/collect.py --city "ירושלים" --limit-per-chain 2 \
            --chain shufersal \
            --chain rami-levy \
            --chain osher-ad \
            --chain maayan-2000
      - name: Commit public price snapshots and diagnostics
        if: always()
        run: |
          git config user.name "pricecompare-data-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -d data ]; then
            git add data/
            if ! git diff --cached --quiet; then
              git commit -m "data: bootstrap priority Jerusalem supermarkets"
              git fetch origin main
              git rebase origin/main
              git push origin HEAD:main
            fi
          fi
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: priority-import-report
          path: data/status.json
          if-no-files-found: warn
          retention-days: 7
      - name: Fail if no source was reachable
        if: steps.collect.outcome != 'success'
        run: exit 1
